# L'offre gratuite de Render endort l'API après 15 minutes sans requête (premier appel : ~30 s).
# Ce petit appel toutes les 10 minutes la garde éveillée pendant la durée du hackathon.
name: Garder l'API éveillée

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Appeler la sonde de santé
        run: curl --silent --show-error --fail --max-time 60 https://cantine-vatel-api.onrender.com/api/v1/health
